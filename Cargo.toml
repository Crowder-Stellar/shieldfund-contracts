[workspace]
members = [
    "treasury_vault",
    "streaming",
    "proof_registry",
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = { version = "22" }

# Optimise WASM output for all release builds
[profile.release]
opt-level     = "z"
overflow-checks = true
debug         = 0
strip         = "symbols"
debug-assertions = false
panic         = "abort"
codegen-units = 1
lto           = true

# ──────────────────────────────────────────────
# NOTE: This directory is designed to be pushed
# as its OWN repository: shieldfund-contracts
# It has zero dependency on the frontend (../src)
# and can be built / deployed independently with
# the Stellar CLI.
# ──────────────────────────────────────────────
